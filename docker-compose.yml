version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes 
      - MYSQL_DATABASE=internal_task_system
    volumes:
      - mysql_data:/var/lib/mysql
      - ./internal-task-backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306" 

  backend:
    build: ./internal-task-backend
    network_mode: "service:mysql" 
    environment:
      - DB_HOST=localhost
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=internal_task_system
      - JWT_SECRET=your_jwt_secret_here
      - PORT=3000
    depends_on:
      - mysql

  frontend:
    build: ./internal-task-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data: