version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root1234
      - MYSQL_DATABASE=internal_task_system
    volumes:
      - mysql_data:/var/lib/mysql
      - ./internal-task-backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306" 

  backend:
    build: ./internal-task-backend
    # ลบ network_mode ออกเพื่อให้เปิดพอร์ต 3000 ได้
    ports:
      - "3000:3000"
    environment:
      # เปลี่ยนจาก localhost เป็น mysql เพื่อให้วิ่งไปหา Service mysql ใน Docker
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=internal_task_system
      - JWT_SECRET=your_jwt_secret_here
      - PORT=3000
    depends_on:
      - mysql

  frontend:
    build: ./internal-task-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data: